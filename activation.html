    <script>
        // Set dynamic 5-day expiration limits
        const today = new Date();
        const expirationDate = new Date(today.getTime() + (5 * 24 * 60 * 60 * 1000));
        document.getElementById('expDate').innerText = expirationDate.toLocaleDateString('en-IN', { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });

        // Your specific operational pricing data model matrix
        const pricingMatrix = {
            bike: { title: "Bike Driver Plan", math: "₹699 x 2 = ₹1,398", total: 1398, terms: "3 Months Bundle (Includes 1 Month OFF)" },
            scooty: { title: "Scooty Driver Plan", math: "₹899 x 2 = ₹1,798", total: 1798, terms: "3 Months Bundle (Includes 1 Month OFF)" },
            auto: { title: "Auto Driver Plan", math: "₹1,199 x 2 = ₹2,398", total: 2398, terms: "3 Months Bundle (Includes 1 Month OFF)" },
            nonac: { title: "Non-AC Cab Plan", math: "₹1,499 x 2 = ₹2,998", total: 2998, terms: "3 Months Bundle (Includes 1 Month FREE)" },
            accab: { title: "AC Cab Premium Plan", math: "₹1,699 x 2 = ₹3,998", total: 3998, terms: "3 Months Bundle (Includes 1 Month Discount)" }
        };

        function calculateTierPlan() {
            const selection = document.getElementById('vehicleCategory').value;
            const summaryCard = document.getElementById('planSummaryCard');
            
            if (!selection) {
                summaryCard.style.display = "none";
                return;
            }
            
            const selectedPlan = pricingMatrix[selection];
            document.getElementById('displayPlanTitle').innerText = selectedPlan.title;
            document.getElementById('displayMath').innerText = selectedPlan.math;
            document.getElementById('displayTerms').innerText = selectedPlan.terms;
            
            summaryCard.style.display = "block";
        }

        // Mock Checkout Form Form Submission Handler
        document.getElementById('paymentActivationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('driverPhone').value;
            const category = document.getElementById('vehicleCategory').value;
            const targetPlan = pricingMatrix[category];

            alert(Connecting Gateway...\nProcessing transaction total of ₹${targetPlan.total} for your ${targetPlan.title}.\nAccount: +91 ${phone});

            document.getElementById('paymentActivationForm').style.display = "none";
            document.getElementById('deadlineAlert').style.display = "none";

            // Generate secure 90-day cycle unique token keys
            const randomString = Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            const secureKey = SR-${category.toUpperCase()}-${randomString};
            
            localStorage.setItem('subscription_cycle_start', new Date().getTime());

            document.getElementById('generatedKey').innerText = secureKey;
            document.getElementById('successBox').style.display = "block";
        });

        // CRUCIAL MISSING REDIRECTION LINE FIXED
        function enterDashboard() {
            // Because this file sits in the root folder, we route them down into the app directory!
            window.location.href = "app/dashboard.html";
        }
    </script>
