    <script>
(function(){
  const form=document.getElementById('paymentActivationForm');
  const summary=document.getElementById('planSummaryCard');
  const success=document.getElementById('successBox');
  const deadline=document.getElementById('deadlineAlert');
  if(deadline)deadline.style.display='none';
  if(success)success.style.display='none';
  if(summary)summary.style.display='none';
  function calculateTierPlan(){
    const selection=document.getElementById('vehicleCategory')?.value||'';
    if(!summary||!selection){if(summary)summary.style.display='none';return;}
    const title=document.getElementById('displayPlanTitle');
    const offer=document.getElementById('displayOffer');
    const math=document.getElementById('displayMath');
    const terms=document.getElementById('displayTerms');
    if(title)title.textContent='Online activation unavailable';
    if(offer)offer.textContent='No payment due through this page';
    if(math)math.textContent='Awaiting approved plan and verified payment gateway';
    if(terms)terms.textContent='No payment is accepted and no driver access key is generated here.';
    summary.style.display='block';
  }
  window.calculateTierPlan=calculateTierPlan;
  if(form){
    const button=form.querySelector('button[type="submit"]');
    if(button){button.disabled=true;button.textContent='Online activation unavailable';}
    const notice=document.createElement('p');
    notice.className='alert-window';
    notice.textContent='Payment activation is not connected to a verified gateway. Do not make a payment or share an OTP on this page. No account will be activated here.';
    form.prepend(notice);
    form.addEventListener('submit',function(event){
      event.preventDefault();
      alert('Online activation is unavailable. No payment has been taken and no activation key has been generated.');
    });
  }
  const enter=document.querySelector('[onclick="enterDashboard()"]');
  if(enter)enter.disabled=true;
  window.enterDashboard=function(){
    alert('Driver access is available only after server-side verification. This page cannot activate an account.');
  };
})();
</script>
</body>
</html>
