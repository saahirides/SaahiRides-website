name: Gemini Autonomous Bug-Fix Agent

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app/*.html"
      - "!app/admin.html"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gemini Code Auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/gemini_audit.py

      - name: Open Auto-Fix Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: autonomous Gemini HTML & link repair"
          branch: gemini-autofix/repair
          title: "Gemini Auto-Fix: HTML & Link Fault Repairs"
          body: "Automated audit repaired HTML/link issues while keeping app/admin.html untouched."
