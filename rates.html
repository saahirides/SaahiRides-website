<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rates</title>
<style>
:root{--sr-navy:#071931;--sr-card:#16223F;--sr-cyan:#00F0FF;--sr-gold:#FFC107}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#132c4d 0%,var(--sr-navy) 68%);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;font-family:Arial,Helvetica,sans-serif}
.box{position:relative;padding:12px;background:var(--sr-card);border:1px solid rgba(0,240,255,.25);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.32);max-width:700px;width:100%}
img{width:100%;max-width:650px;border-radius:10px;display:block;margin:auto}
.close{position:absolute;top:-12px;right:-12px;background:var(--sr-gold);color:#071931;width:36px;height:36px;border:2px solid var(--sr-navy);border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;font-size:20px;box-shadow:0 4px 12px #0005}
.close:hover,.close:focus-visible{background:var(--sr-cyan);outline:2px solid white;outline-offset:2px}
</style>
</head>
<body>
<div class="box">
<a class="close" href="index.html">X</a>
<img src="janmaasthami-rates.jpg">
</div>
</body>
</html>
