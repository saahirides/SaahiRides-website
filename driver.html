<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Portal - SaahiRides</title>
    <!-- Firebase App and Firestore SDKs (Free Tier) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        /* Clean, non-intrusive styling for your new form */
        .driver-form-container {
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            background-color: #25D366; /* Matching WhatsApp theme colors */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #128C7E;
        }
        /* 3 Hidden Placeholder Buttons that take up space but are invisible */
        .hidden-space-holder {
            opacity: 0;
            visibility: hidden;
            display: block;
            margin: 15px auto;
            padding: 10px;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <!-- YOUR EXISTING NAVIGATION LINKS/BUTTONS STAY HERE UNTOUCHED -->
    <!-- (The web editor will keep your "Driver Portal", "Customer Portal", "Back to Website" layout intact) -->

    <!-- NEW DATA COLLECTION FORM (Placed in the empty space) -->
    <div class="driver-form-container">
        <h3>Driver Registration Portal</h3>
        <form id="driverOnboardingForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" required placeholder="Enter phone number">
            </div>
            <div class="form-group">
                <label for="vehicleType">Vehicle Type</label>
                <select id="vehicleType" required>
                    <option value="">Select Vehicle</option>
                    <option value="Bike">Bike</option>
                    <option value="Auto">Auto</option>
                    <option value="Car">Car</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Submit Driver Profile</button>
        </form>
    </div>

    <!-- THREE INVISIBLE PLACEHOLDER BUTTONS (Saves layout space for future features) -->
    <button class="hidden-space-holder">Placeholder 1</button>
    <button class="hidden-space-holder">Placeholder 2</button>
    <button class="hidden-space-holder">Placeholder 3</button>

    <!-- REAL-TIME DATABASE SYNC SCRIPT -->
    <script>
        // Replace these placeholder values with your free Firebase keys later
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "://firebaseapp.com",
            projectId: "saahirides-website",
            storageBucket: "://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Handle Form Submission smoothly without page reloading
        document.getElementById('driverOnboardingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const driverData = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                vehicleType: document.getElementById('vehicleType').value,
                registeredAt: new Date()
            };

            // Save records directly into a live cloud collection shared with the web/app setup
            db.collection("drivers").add(driverData)
            .then(() => {
                alert("Driver Data successfully synced in real-time!");
                document.getElementById('driverOnboardingForm').reset();
            })
            .catch((error) => {
                console.error("Error saving record: ", error);
                alert("Database sync failed. Please check setup keys.");
            });
        });
    </script>
</body>
</html>
