<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaahiRides App</title>
<style>
body { background:#0F2A44; color:white; font-family: sans-serif; text-align:center; padding: 30px 20px; }
.header { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:20px; }
.logo { font-size: 36px; }
.brand { color: #FF6B00; font-size: 20px; font-weight: bold; white-space: nowrap; }
.tagline { color: #FFB066; font-size: 14px; margin-top:6px; letter-spacing: 0.5px; font-weight: 600; }
h2 { font-size:28px; margin-top:30px; margin-bottom:10px; }
p { color:#9CA3AF; margin-bottom:30px; }
.btn { display:block; width:100%; padding:18px; border-radius:12px; margin:15px 0; font-size:18px; font-weight:bold; text-decoration:none; border:none; box-sizing:border-box; }
.green { background:#22C55E; color:white; }
.blue { background:#0E7490; color:white; }
.white { background:transparent; color:white; border:2px solid white; }

</head>

<div class="header">
  <span class="logo">🚩</span>
  <span class="brand">SaahiRides Transit Pvt Ltd</span>
</div>

<h2>Choose Your Access</h2>
<p>Select how you'd like to continue</p>

<a href="/" class="btn green">Customer - Book Your Ride</a>
<a href="/driver" class="btn blue">Driver - Driver Login</a>
<a href="/" class="btn white">Visit Full Website</a>
