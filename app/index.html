<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaahiRides App</title>
<style>
body{background:#0A2342;color:white;font-family:sans-serif;text-align:center;padding:20px;margin:0}
.wrapper{max-width:380px;margin:0 auto}
.logo-main{width:220px;margin-top:10px}
.brand{color:#FF8C00;font-size:26px;font-weight:900;display:block;margin-top:10px;white-space:nowrap}
.tagline{color:#FFC06E;font-size:13px;margin-top:6px;font-weight:600}
h2{font-size:24px;margin-top:28px;margin-bottom:6px}
.sub{color:#9CA3AF;font-size:13px;margin-bottom:24px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:bold;text-decoration:none;margin:12px 0;box-sizing:border-box}
.g{background:#22C55E;color:white}.b{background:#0E9CBF;color:white}.w{background:transparent;color:white;border:1.5px solid white}
</style>
</head>
<body>
<div class="wrapper">
  <img src="logo.png" class="logo-main" alt="SaahiRides Logo">
  <span class="brand">SaahiRides Transit Pvt Ltd</span>
  <div class="tagline">SaahiRide - SaafeRide @ SaahiPrice</div>
  <h2>Choose Your Access</h2>
  <div class="sub">Select how you'd like to continue</div>
  <a href="/" class="btn g">Customer - Book Your Ride</a>
  <a href="/driver" class="btn b">Driver - Driver Login</a>
  <a href="/" class="btn w">Visit Full Website</a>
</div>
</body>
</html>
