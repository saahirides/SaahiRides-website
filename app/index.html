<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaahiRides</title>
<style>
body{margin:0;background:#0a192f;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:white}
.logo{width:220px;margin-bottom:10px;border-radius:10px}
.card{background:white;color:#0a192f;padding:25px;border-radius:20px;width:85%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;background:#e11d2a;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}
#recaptcha-container{margin-top:15px;display:flex;justify-content:center}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<img src="./IMG-20260917-WA9327.jpg" class="logo">
<h1 style="color:#e11d2a;margin:0">Saahi<span style="color:#f5c542">Rides</span></h1>
<p style="font-size:11px;opacity:0.8">SaahiRides Transit Pvt. Ltd.</p>
<div class="card">
<h2>Welcome</h2>
<input id="phone" type="tel" value="+91 ">
<input id="otp" type="text" placeholder="Enter 6-digit OTP" style="display:none">
<button id="sendBtn">Send OTP</button>
<button id="verifyBtn" style="display:none">Verify OTP</button>
<div id="recaptcha-container"></div>
<p id="msg" style="font-size:13px;margin-top:10px"></p>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyA5ISVRjnuaGqVJmcYC2yQjo60mTASnQdk",authDomain:"saahirides-transit-pvt-l-6f4b0.firebaseapp.com",projectId:"saahirides-transit-pvt-l-6f4b0",storageBucket:"saahirides-transit-pvt-l-6f4b0.firebasestorage.app",messagingSenderId:"546887705562",appId:"1:546887705562:web:42204adb2b1d58ffa656e3",measurementId:"G-HCQNZBY90L"};
firebase.initializeApp(firebaseConfig);
let confirmationResult=null;let recaptchaVerifier=null;
function initRecaptcha(){if(!recaptchaVerifier){recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'normal'});recaptchaVerifier.render();}}
initRecaptcha();
const phoneInput=document.getElementById('phone');const otpInput=document.getElementById('otp');const sendBtn=document.getElementById('sendBtn');const verifyBtn=document.getElementById('verifyBtn');const msg=document.getElementById('msg');
sendBtn.onclick=async()=>{const phone=phoneInput.value.trim();if(phone.length<13){msg.innerText="Number sahi daal: +91XXXXXXXXXX";return;}msg.innerText="OTP bhej raha hu...";sendBtn.disabled=true;try{confirmationResult=await firebase.auth().signInWithPhoneNumber(phone,recaptchaVerifier);msg.style.color="green";msg.innerText="OTP bhej diya!";phoneInput.style.display="none";sendBtn.style.display="none";otpInput.style.display="block";verifyBtn.style.display="block";}catch(e){msg.style.color="red";msg.innerText=e.message;sendBtn.disabled=false;try{recaptchaVerifier.clear();}catch(err){}recaptchaVerifier=null;initRecaptcha();}};
verifyBtn.onclick=async()=>{const code=otpInput.value.trim();if(code.length!=6){msg.innerText="6 digit OTP daal";return;}msg.innerText="Verify kar raha hu...";verifyBtn.disabled=true;try{await confirmationResult.confirm(code);msg.style.color="green";msg.innerText="Login ho gaya Mamu! 🎉";}catch(e){msg.style.color="red";msg.innerText="Galat OTP! "+e.message;verifyBtn.disabled=false;}};
</script>
</body>
</html>
