<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaahiRides</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body,html{height:100%;background:#081b33;overflow:hidden}
.screen{position:fixed;inset:0;background:#081b33;display:none;flex-direction:column;overflow-y:auto}
.screen.active{display:flex}
#splash{background:#081b33 url('./splash.jpg') center/cover no-repeat;z-index:9999}
.card{background:white;border-radius:18px;padding:22px;width:92%;max-width:380px;margin:auto}
.lang-btn{width:100%;padding:12px;margin:6px 0;border:1.5px solid #C9A86A;border-radius:10px;background:white;font-weight:800}
.lang-btn.active{background:#081b33;color:#C9A86A}
.inputBox{width:100%;padding:14px;border:1.5px solid #C9A86A;border-radius:12px;margin:10px 0;font-size:16px}
.gold-btn{width:100%;padding:14px;background:linear-gradient(135deg,#E8C87A,#C9A86A);border:none;border-radius:12px;font-weight:900;color:#081b33}
</style></head><body>

<!-- 1. FIRST PAGE = TERA POSTER wa_image_6942205122554237495 ko splash.jpg bana ke daal -->
<div id="splash" class="screen active" onclick="show('lang')"></div>

<!-- 2. LANGUAGE SCREEN - YAHAN LANGUAGE CHOOSE HOTA HAI -->
<div id="lang" class="screen">
  <div class="card">
    <h3 id="t1" style="color:#081b33">Choose Language</h3>
    <button class="lang-btn" onclick="setLang('en',this)">English</button>
    <button class="lang-btn" onclick="setLang('hi',this)">हिंदी</button>
    <button class="lang-btn" onclick="setLang('te',this)">తెలుగు</button>
    <button id="cBtn" class="gold-btn" style="display:none;margin-top:12px;background:#081b33;color:#C9A86A" onclick="show('otp')">Continue / जारी रखें</button>
  </div>
</div>

<!-- 3. OTP SCREEN - YAHAN OTP 123456 HAI -->
<div id="otp" class="screen" style="justify-content:center;align-items:center">
  <div style="text-align:center;margin-bottom:15px"><img src="./logo.png" style="width:60px"><div style="font-size:28px;font-weight:900"><span style="color:#E53935">Saahi</span><span style="color:#C9A86A">Rides</span></div></div>
  <div class="card">
    <h2 id="t2" style="color:#081b33">Welcome</h2>
    <input class="inputBox" id="phone" value="+91 9347946026">
    <input class="inputBox" id="otpIn" placeholder="OTP 123456" style="display:none">
    <button id="sBtn" class="gold-btn" onclick="sendOtp()">Continue</button>
    <button id="vBtn" class="gold-btn" style="display:none" onclick="show('home')">Verify OTP</button>
    <p id="msg" style="font-size:12px;text-align:center;color:green;margin-top:8px"></p>
  </div>
</div>

<!-- 4. HOME SCREEN - YAHAN BOOK YOUR RIDE HAI -->
<div id="home" class="screen">
  <div style="background:#081b33;color:white;padding:16px 15px 40px;border-radius:0 0 26px 26px">
    <b>SaahiRides</b> <span style="float:right;font-size:11px" onclick="location.reload()">Logout</span><br>
    <div style="margin-top:12px;font-size:11px">📍 Pickup: Kapra</div>
  </div>
  <div style="padding:15px;margin-top:-20px">
    <div id="t3" style="font-size:24px;font-weight:900;color:white">Book Your Ride</div>
    <div style="background:white;padding:20px;border-radius:16px;margin-top:10px;text-align:center">
      🛺 Sawari auto - OTP 123456 se login successful<br><br>
      <button class="gold-btn" onclick="alert('Sawari Flow - 6 vehicles + Real-time + Route Lock')">Go to Sawari</button>
    </div>
  </div>
</div>

<script>
const T={
 en:{choose:"Choose Language",welcome:"Welcome",cont:"Continue",verify:"Verify OTP",book:"Book Your Ride"},
 hi:{choose:"भाषा चुनें",welcome:"स्वागत है",cont:"जारी रखें",verify:"OTP सत्यापित करें",book:"अपनी सवारी बुक करें"},
 te:{choose:"భాషను ఎంచుకోండి",welcome:"స్వాగతం",cont:"కొనసాగించు",verify:"OTP ధృవీకరించండి",book:"మీ రైడ్ బుక్ చేయండి"}
};
function applyLang(l){
 let d=T[l];
 document.getElementById('t1').innerText=d.choose;
 document.getElementById('cBtn').innerText=d.cont;
 document.getElementById('t2').innerText=d.welcome;
 document.getElementById('sBtn').innerText=d.cont;
 document.getElementById('vBtn').innerText=d.verify;
 document.getElementById('t3').innerText=d.book;
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function setLang(l,el){
 localStorage.setItem('saahi_lang',l);
 applyLang(l);
 document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('cBtn').style.display='block';
}
function sendOtp(){
 document.getElementById('msg').innerText='OTP is 123456';
 document.getElementById('sBtn').style.display='none';
 document.getElementById('otpIn').style.display='block';
 document.getElementById('vBtn').style.display='block';
 document.getElementById('otpIn').value='123456';
}
// auto splash -> lang after 3 sec
setTimeout(()=>{ if(document.getElementById('splash').classList.contains('active')) show('lang'); },3000);
// load saved lang
let sv=localStorage.getItem('saahi_lang'); if(sv) applyLang(sv);
</script>
</body></html>
