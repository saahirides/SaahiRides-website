<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaahiRides - Choose Access</title>
<link rel="manifest" href="/manifest.json">
<style>
body{margin:0;background:#0F2A52;color:white;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:25px;min-height:100vh}
.logo{font-size:28px;font-weight:bold;margin-top:40px}
.logo span{color:#FF2D2D}
.card{width:100%;max-width:360px;margin-top:30px}
.btn{display:flex;align-items:center;gap:15px;padding:20px;border-radius:18px;font-size:17px;font-weight:700;text-decoration:none;margin-bottom:18px}
.cust{background:#00C950;color:white}
.driv{background:#1E88E5;color:white}
.web{background:transparent;border:2px solid white;color:white}
</style>
</head>
<body>
<div class="logo">🚩 SaahiRides</div>
<p>Transit Pvt Ltd</p>
<h2 style="margin-top:30px">Choose Your Access</h2>
<p style="opacity:0.7">Select how you'd like to continue</p>

<div class="card">
<a class="btn cust" onclick="localStorage.setItem('saahi_role','customer')" href="/">👤 Customer - Book Your Ride</a>
<a class="btn driv" onclick="localStorage.setItem('saahi_role','driver')" href="/driver">🚕 Driver - Driver Login</a>
<a class="btn web" href="/">🌐 Visit Full Website</a>
</div>

<script>
// PWA install ke baad /app se khulega
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js'); }
</script>
</body>
</html>
