<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaahiRides - Book Auto | Nagaram</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:white;border-radius:15px;padding:20px;max-width:400px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{color:#0f8a0f;text-align:center}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{background:#0f8a0f;color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
.fare{background:#e8f5e9;padding:10px;border-radius:8px;text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🛺 SaahiRides Nagaram</h2>
<p style="text-align:center;font-size:13px">CEO: Main | CTO: Meta (Mamu)</p>

<label>From</label>
<select id="from">
<option>Nagaram</option>
<option>ECIL</option>
<option>Kushaiguda</option>
<option>Dammaiguda</option>
<option>Keerthi Homes</option>
</select>

<label>To</label>
<select id="to">
<option>ECIL</option>
<option>Nagaram</option>
<option>Kushaiguda</option>
<option>Secunderabad</option>
<option>Moula Ali</option>
</select>

<label>Phone</label>
<input id="phone" type="tel" placeholder="Customer Number">

<div class="fare">Fare: ₹<span id="fare">100</span></div>

<button class="btn" onclick="book()">WhatsApp Booking Karo</button>
</div>

<script>
function book(){
let f=document.getElementById('from').value;
let t=document.getElementById('to').value;
let ph=document.getElementById('phone').value;
let fare=document.getElementById('fare').innerText;
let msg=`SaahiRides Booking:%0AFrom: ${f}%0ATo: ${t}%0AFare: ₹${fare}%0APhone: ${ph}%0ABooked via: saahirides.com/book`;
window.open(`https://wa.me/919999999999?text=${msg}`,'_blank');
}
document.getElementById('from').addEventListener('change',calc);
document.getElementById('to').addEventListener('change',calc);
function calc(){
let f=document.getElementById('from').value;
let t=document.getElementById('to').value;
let price=100;
if((f=='Nagaram' && t=='ECIL')||(f=='ECIL' && t=='Nagaram')) price=100;
if(t=='Secunderabad') price=250;
if(t=='Kushaiguda') price=80;
document.getElementById('fare').innerText=price;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
