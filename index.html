*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px 25px;text-align:center}
.logo{width:175px;margin-top:15px}
h1{font-size:20px;font-weight:800;color:#7ec8ff;white-space:nowrap;margin-top:14px}
.gap{height:26px}

.moto{font-size:12.5px;font-weight:800}

/* ONE LINE - NO BBOX */
.one-line{width:100%;max-width:980px;margin-top:28px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.book{flex:1.2;min-width:160px;background:#00e676;color:#fff;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:800;font-size:15px;text-align:center;box-shadow:0 8px 20px rgba(0,230,118,.35)}
.mid{display:flex;gap:8px;flex:1.5;min-width:220px;justify-content:center}
.mid a{flex:1;padding:12px 0;border-radius:999px;text-decoration:none;font-weight:700;font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;text-align:center}
.mid a.blue{background:#2a7fff;border:0}
.founder{flex:0.9;min-width:150px;background:linear-gradient(90deg,#3b5bdb,#8a5cff);color:#fff;padding:11px 10px;border-radius:999px;text-decoration:none;font-weight:700;font-size:11px;text-align:center}

.socials{display:flex;gap:10px;margin-top:22px}
.socials a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:800;font-size:12px}
.foot{opacity:.35;font-size:9px;margin-top:12px}

@media(max-width:700px){
.one-line{flex-direction:column;align-items:stretch}
.book{order:1}
.mid{order:2;width:100%}
.founder{order:3;width:100%}
}
</style>
