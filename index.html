<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaahiRides | Hyderabad</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; background:#06122E; font-family:'Poppins', sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .landing-box{
    max-width:950px; width:100%; text-align:center;
  }
  .card-img{
    width:100%; max-width:850px; border-radius:18px;
    box-shadow:0 0 40px rgba(255,215,0,0.3);
    border:2px solid #D4AF37;
  }
  .tagline-sujata{
    color:#FFD700; margin-top:18px; font-size:14px; letter-spacing:1px;
  }
  .tagline-sujata span{ color:#fff; font-weight:600; }
  .btn-row{
    margin-top:25px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
  }
  .btn{
    padding:14px 32px; border-radius:50px; font-weight:800; text-decoration:none;
    font-size:16px; transition:0.3s; min-width:180px;
  }
  .btn-gold{
    background:linear-gradient(90deg, #D4AF37, #FFD700); color:#06122E;
  }
  .btn-outline{
    background:transparent; color:#FFD700; border:2px solid #D4AF37;
  }
  .btn:hover{ transform:scale(1.05); box-shadow:0 5px 20px rgba(255,215,0,0.4); }
</style>
</head>
<body>
  <div class="landing-box">
    <!-- Yahi teri image hai -->
    <img src="founder-card.png" class="card-img" alt="SaahiRides Founder Hyderabad">

    <div class="tagline-sujata">
      Inspired by my wife <span>Sujata ❤️</span> - For every family of Hyderabad
    </div>

    <div class="btn-row">
      <a href="/website/" class="btn btn-gold">Explore Website 🌐</a>
      <a href="/app/" class="btn btn-outline">GoTo App 📱</a>
    </div>
  </div>
</body>
</html>
